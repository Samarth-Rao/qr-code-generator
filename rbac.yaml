apiVersion: v1
kind: ServiceAccount
metadata:
  name: qr-generator-sa
  namespace: qr-generator
  labels:
    app: qr-generator
    version: v1.0.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qr-generator-role
  namespace: qr-generator
  labels:
    app: qr-generator
    version: v1.0.0
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qr-generator-rolebinding
  namespace: qr-generator
  labels:
    app: qr-generator
    version: v1.0.0
subjects:
- kind: ServiceAccount
  name: qr-generator-sa
  namespace: qr-generator
roleRef:
  kind: Role
  name: qr-generator-role
  apiGroup: rbac.authorization.k8s.io 