apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-generator
  namespace: qr-generator
  labels:
    app: qr-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qr-generator
  template:
    metadata:
      labels:
        app: qr-generator
    spec:
      containers:
      - name: qr-generator
        image: qr-generator:latest
        imagePullPolicy: Never  # For local Kind cluster
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_HOST
          valueFrom:
            configMapKeyRef:
              name: qr-generator-config
              key: APP_HOST
        - name: APP_PORT
          valueFrom:
            configMapKeyRef:
              name: qr-generator-config
              key: APP_PORT
        - name: DEFAULT_QR_SIZE
          valueFrom:
            configMapKeyRef:
              name: qr-generator-config
              key: DEFAULT_QR_SIZE
        - name: DEFAULT_BOX_SIZE
          valueFrom:
            configMapKeyRef:
              name: qr-generator-config
              key: DEFAULT_BOX_SIZE
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: qr-codes-storage
          mountPath: /app/static
      volumes:
      - name: qr-codes-storage
        emptyDir: {} 