kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # NGINX Ingress Controller (http://qr-generator.local)
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # qr-generator-service NodePort (http://localhost:30080)
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
- role: worker
- role: worker
