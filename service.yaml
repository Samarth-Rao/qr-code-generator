apiVersion: v1
kind: Service
metadata:
  name: qr-generator-service
  namespace: qr-generator
  labels:
    app: qr-generator
    version: v1.0.0
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    nodePort: 30443
    protocol: TCP
    name: https
  selector:
    app: qr-generator
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800 